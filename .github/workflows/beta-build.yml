name: Unsigned beta builds

on:
  workflow_dispatch:
  push:
    branches: ['release/bitcoin-browser-v0.1.0']

permissions:
  contents: read

concurrency:
  group: unsigned-beta-${{ github.ref }}
  cancel-in-progress: false

env:
  npm_config_registry: https://registry.npmjs.org
  BETA_WINDOWS_SIGNING: unsigned-beta
  BETA_MACOS_SIGNING: unsigned-beta

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - run: npm run security:beta
      - run: npm audit --audit-level=high

  build:
    name: Unsigned beta (${{ matrix.id }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: macos-arm64, runner: macos-15, arch: arm64 }
          - { id: macos-x64, runner: macos-15-intel, arch: x64 }
          - { id: windows-x64, runner: windows-2022, arch: x64 }
          - { id: windows-arm64, runner: windows-11-arm, arch: arm64 }
          - { id: linux-x64, runner: ubuntu-22.04, arch: x64 }
          - { id: linux-arm64, runner: ubuntu-22.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - run: node scripts/beta-release.mjs assert-native ${{ matrix.id }}
      - name: Linux packaging and desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rpm xvfb dbus-x11 libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 libxss1 libx11-xcb1 libdrm2 libxshmfence1
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: Build unsigned macOS beta
        if: runner.os == 'macOS'
        run: npm run dist:mac -- --${{ matrix.arch }} --unsigned-macos-beta
      - name: Build unsigned Windows beta
        if: runner.os == 'Windows'
        run: npm run dist:win -- --${{ matrix.arch }} --unsigned-windows-beta
      - name: Verify unsigned Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1 -Architecture ${{ matrix.arch }} -SigningMode unsigned-beta
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run dist:linux -- --${{ matrix.arch }}
      - name: Native macOS smoke
        if: runner.os == 'macOS'
        run: npm run smoke:packaged -- --distribution --unsigned-macos-beta --report=packaged-smoke-beta-${{ matrix.id }}.json
      - name: Native Windows smoke
        if: runner.os == 'Windows'
        run: npm run smoke:packaged -- --distribution --unsigned-windows-beta --report=packaged-smoke-beta-${{ matrix.id }}.json
      - name: Native Linux smoke
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a npm run smoke:packaged -- --distribution --report=packaged-smoke-beta-${{ matrix.id }}.json
      - name: Stage verified download formats
        run: node scripts/beta-release.mjs stage ${{ matrix.id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-installers-${{ matrix.id }}
          path: release/beta-assets/${{ matrix.id }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain bounded native smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-smoke-${{ matrix.id }}
          path: release/packaged-smoke-beta-${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 14
